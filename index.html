<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>墨韵起名 · AI 为名字找到出处</title>
<meta name="description" content="输入姓氏与期待，AI 流式生成三组有出处、有寓意的中文名字，并自动存档。" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23b23a2f'/%3E%3Ctext x='50' y='70' font-size='56' text-anchor='middle' fill='%23f6f1e7' font-family='serif'%3E%E5%90%8D%3C/text%3E%3C/svg%3E" />
<style>
  :root {
    --paper: #f6f1e7;
    --paper-deep: #efe6d6;
    --card: rgba(255, 253, 247, 0.86);
    --ink: #232b27;
    --ink-soft: #5d665f;
    --ink-faint: #8b938c;
    --line: rgba(35, 43, 39, 0.14);
    --cinnabar: #b23a2f;
    --cinnabar-deep: #8e2c23;
    --jade: #5c7a68;
    --serif: "Noto Serif SC", "Songti SC", "STSong", "SimSun", "Source Han Serif SC", serif;
    --sans: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    --shadow: 0 24px 70px -38px rgba(48, 40, 24, 0.45);
  }

  * { box-sizing: border-box; }

  [hidden] { display: none !important; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 38px 5vw 52px;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    position: relative;
    overflow-x: hidden;
  }

  .wash {
    position: fixed;
    z-index: -1;
    border-radius: 50%;
    filter: blur(90px);
    pointer-events: none;
  }
  .wash-a {
    width: 46vw;
    height: 46vw;
    left: -14vw;
    top: -18vw;
    background: radial-gradient(circle, rgba(91, 122, 104, 0.22), transparent 68%);
  }
  .wash-b {
    width: 52vw;
    height: 52vw;
    right: -18vw;
    bottom: -24vw;
    background: radial-gradient(circle, rgba(178, 58, 47, 0.16), transparent 70%);
  }

  .shell {
    max-width: 1180px;
    margin: 0 auto;
  }

  .header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--line);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .seal {
    display: grid;
    place-items: center;
    width: 46px;
    height: 46px;
    background: var(--cinnabar);
    color: #f8f2e6;
    font-family: var(--serif);
    font-size: 26px;
    line-height: 1;
    border-radius: 5px;
    transform: rotate(-3deg);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.22), 0 6px 16px -8px rgba(142, 44, 35, 0.9);
  }

  .brand-text { display: flex; flex-direction: column; gap: 4px; }
  .brand-text strong {
    font-family: var(--serif);
    font-size: 26px;
    font-weight: 600;
    letter-spacing: 4px;
    line-height: 1;
  }
  .brand-text small {
    font-size: 9px;
    letter-spacing: 3.4px;
    color: var(--ink-faint);
    text-transform: uppercase;
  }

  .header-tag {
    margin: 0 0 2px;
    font-family: var(--serif);
    font-size: 13px;
    letter-spacing: 2px;
    color: var(--ink-soft);
  }

  .layout {
    display: grid;
    grid-template-columns: minmax(0, 0.94fr) minmax(0, 1.06fr);
    gap: 26px;
    align-items: start;
    margin-top: 30px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 30px 30px 26px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    animation: rise 0.7s ease both;
  }
  .result-card { animation-delay: 0.08s; display: flex; flex-direction: column; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card-head {
    display: flex;
    align-items: flex-start;
    gap: 14px;
  }

  .num {
    flex: none;
    display: grid;
    place-items: center;
    width: 28px;
    height: 28px;
    margin-top: 1px;
    border: 1px solid rgba(178, 58, 47, 0.45);
    border-radius: 50%;
    color: var(--cinnabar);
    font-family: var(--serif);
    font-size: 13px;
  }

  .card-head h2 {
    margin: 0;
    font-family: var(--serif);
    font-size: 19px;
    font-weight: 600;
    letter-spacing: 2px;
    line-height: 1.3;
  }
  .card-head p {
    margin: 5px 0 0;
    font-size: 12px;
    color: var(--ink-faint);
    letter-spacing: 0.4px;
  }

  .copy {
    margin-left: auto;
    flex: none;
    padding: 7px 13px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: transparent;
    color: var(--ink-soft);
    font-family: var(--sans);
    font-size: 12.5px;
    cursor: pointer;
    transition: 0.2s ease;
  }
  .copy:hover:not(:disabled) { border-color: var(--ink); color: var(--ink); }
  .copy:disabled { opacity: 0.35; cursor: default; }

  form { margin-top: 26px; display: flex; flex-direction: column; gap: 20px; }

  .field-row {
    display: grid;
    grid-template-columns: 1fr 1.35fr;
    gap: 16px;
  }

  .field { display: flex; flex-direction: column; min-width: 0; }
  .field label {
    font-size: 12.5px;
    letter-spacing: 1px;
    color: var(--ink-soft);
    margin-bottom: 9px;
  }
  .hint {
    font-size: 10.5px;
    color: var(--ink-faint);
    letter-spacing: 0;
    margin-left: 5px;
  }

  input[type="text"] {
    height: 46px;
    padding: 0 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fffdf8;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    letter-spacing: 2px;
    outline: none;
    transition: 0.2s ease;
    width: 100%;
  }
  input[type="text"]::placeholder { color: #b0b5ae; letter-spacing: 1px; }
  input[type="text"]:focus {
    border-color: rgba(178, 58, 47, 0.6);
    box-shadow: 0 0 0 3px rgba(178, 58, 47, 0.08);
  }

  .segmented {
    display: flex;
    height: 46px;
    padding: 4px;
    background: var(--paper-deep);
    border-radius: 10px;
    gap: 3px;
  }
  .seg {
    flex: 1;
    border: none;
    border-radius: 7px;
    background: transparent;
    color: var(--ink-soft);
    font-family: var(--sans);
    font-size: 13.5px;
    cursor: pointer;
    transition: 0.2s ease;
    white-space: nowrap;
  }
  .seg.is-active {
    background: #fffdf8;
    color: var(--ink);
    box-shadow: 0 2px 8px -4px rgba(35, 43, 39, 0.35);
  }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 7px 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: transparent;
    color: var(--ink-soft);
    font-family: var(--sans);
    font-size: 13px;
    letter-spacing: 1px;
    cursor: pointer;
    transition: 0.2s ease;
  }
  .chip:hover { border-color: rgba(35, 43, 39, 0.4); color: var(--ink); }
  .chip.is-active {
    background: var(--ink);
    border-color: var(--ink);
    color: #f5f0e5;
  }

  .textarea-wrap { position: relative; }
  textarea {
    width: 100%;
    min-height: 118px;
    padding: 13px 14px 26px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fffdf8;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14.5px;
    line-height: 1.75;
    resize: vertical;
    outline: none;
    transition: 0.2s ease;
  }
  textarea::placeholder { color: #b0b5ae; }
  textarea:focus {
    border-color: rgba(178, 58, 47, 0.6);
    box-shadow: 0 0 0 3px rgba(178, 58, 47, 0.08);
  }
  textarea.is-invalid { border-color: rgba(178, 58, 47, 0.75); }

  .counter {
    position: absolute;
    right: 12px;
    bottom: 9px;
    font-size: 11px;
    color: var(--ink-faint);
    letter-spacing: 0.5px;
    pointer-events: none;
  }

  .select-wrap { position: relative; }
  .select-wrap::after {
    content: "▾";
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ink-soft);
    font-size: 12px;
    pointer-events: none;
  }
  select {
    width: 100%;
    height: 46px;
    padding: 0 38px 0 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fffdf8;
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    appearance: none;
    -webkit-appearance: none;
    outline: none;
    cursor: pointer;
    transition: 0.2s ease;
  }
  select:focus { border-color: rgba(178, 58, 47, 0.6); }

  .submit {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 52px;
    margin-top: 4px;
    padding: 0 22px;
    border: none;
    border-radius: 12px;
    background: var(--ink);
    color: #f7f2e7;
    font-family: var(--sans);
    font-size: 15px;
    letter-spacing: 3px;
    cursor: pointer;
    overflow: hidden;
    transition: background 0.25s ease, transform 0.2s ease;
  }
  .submit:hover:not(:disabled) { background: var(--cinnabar); }
  .submit:active:not(:disabled) { transform: scale(0.995); }
  .submit:disabled { opacity: 0.62; cursor: wait; }
  .submit .arrow {
    font-size: 18px;
    letter-spacing: 0;
    transition: transform 0.25s ease;
  }
  .submit:hover:not(:disabled) .arrow { transform: translateX(5px); }

  .form-foot {
    margin: -6px 0 0;
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.8px;
    color: var(--ink-faint);
  }

  .result {
    flex: 1;
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid var(--line);
    min-height: 440px;
    max-height: 600px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: rgba(35, 43, 39, 0.2) transparent;
  }

  .empty {
    min-height: 400px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px 10px;
  }
  .empty-mark {
    width: 64px;
    height: 64px;
    display: grid;
    place-items: center;
    border: 1px solid rgba(178, 58, 47, 0.35);
    border-radius: 50%;
    color: var(--cinnabar);
    font-family: var(--serif);
    font-size: 30px;
    margin-bottom: 24px;
    position: relative;
  }
  .empty-mark::after {
    content: "";
    position: absolute;
    inset: -8px;
    border: 1px solid rgba(178, 58, 47, 0.12);
    border-radius: 50%;
  }
  .empty-quote {
    margin: 0 0 14px;
    font-family: var(--serif);
    font-size: 17px;
    letter-spacing: 1px;
    color: var(--ink);
  }
  .empty-desc {
    margin: 0;
    font-size: 13.5px;
    line-height: 2;
    color: var(--ink-soft);
  }
  .empty-meta {
    margin-top: 26px;
    font-size: 10.5px;
    letter-spacing: 2px;
    color: var(--ink-faint);
  }

  .output-wrap { display: flex; align-items: flex-end; }
  .output {
    margin: 0;
    flex: 1;
    font-size: 15px;
    line-height: 2.05;
    color: #2a332d;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .caret {
    flex: none;
    width: 8px;
    height: 17px;
    margin-left: 3px;
    background: var(--cinnabar);
    border-radius: 1px;
    animation: blink 1s step-end infinite;
    transform: translateY(-2px);
  }
  .caret[hidden] { display: none; }

  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

  .error-box {
    margin-top: 14px;
    padding: 12px 14px;
    border-left: 3px solid var(--cinnabar);
    background: rgba(178, 58, 47, 0.07);
    border-radius: 4px;
    color: var(--cinnabar-deep);
    font-size: 13px;
    line-height: 1.8;
  }
  .error-box[hidden] { display: none; }

  .result-foot {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 18px;
    padding-top: 15px;
    border-top: 1px dashed var(--line);
    font-size: 11.5px;
    letter-spacing: 0.5px;
    color: var(--ink-faint);
  }
  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #b8bdb6;
    flex: none;
    transition: 0.3s ease;
  }
  .dot.is-live { background: var(--cinnabar); animation: pulse 1.4s ease-in-out infinite; }
  .dot.is-done { background: var(--jade); }
  .dot.is-error { background: var(--cinnabar); }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(178, 58, 47, 0.45); }
    55% { box-shadow: 0 0 0 5px rgba(178, 58, 47, 0); }
  }

  .save-note {
    margin-left: auto;
    color: var(--jade);
    letter-spacing: 0.3px;
  }
  .save-note[hidden] { display: none; }

  footer {
    margin-top: 38px;
    text-align: center;
    font-size: 11px;
    line-height: 2;
    letter-spacing: 0.8px;
    color: var(--ink-faint);
  }
  footer .sep {
    display: inline-block;
    margin: 0 8px;
    color: rgba(35, 43, 39, 0.25);
  }

  @media (max-width: 900px) {
    body { padding: 26px 18px 40px; }
    .layout { grid-template-columns: 1fr; gap: 18px; margin-top: 22px; }
    .header { align-items: center; }
    .header-tag { display: none; }
    .card { padding: 24px 20px 22px; border-radius: 15px; }
    .result { min-height: 360px; max-height: none; }
    .empty { min-height: 320px; }
    .empty-mark { width: 56px; height: 56px; font-size: 26px; margin-bottom: 18px; }
    .field-row { grid-template-columns: 1fr 1fr; gap: 12px; }
    .brand-text strong { font-size: 23px; letter-spacing: 3px; }
  }

  @media (max-width: 420px) {
    .field-row { grid-template-columns: 1fr; }
    .card-head h2 { font-size: 17px; }
    .empty-quote { font-size: 15px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <div class="wash wash-a"></div>
  <div class="wash wash-b"></div>

  <div class="shell">
    <header class="header">
      <div class="brand">
        <span class="seal">名</span>
        <span class="brand-text">
          <strong>墨韵起名</strong>
          <small>AI Naming Studio</small>
        </span>
      </div>
      <p class="header-tag">三组佳名 · 字义典故 · 音律解析</p>
    </header>

    <main class="layout">
      <section class="card form-card">
        <div class="card-head">
          <span class="num">壹</span>
          <div>
            <h2>写下你的期待</h2>
            <p>姓名，是送给孩子的第一件礼物</p>
          </div>
        </div>

        <form id="form">
          <div class="field-row">
            <div class="field">
              <label for="surname">姓氏</label>
              <input id="surname" name="surname" type="text" maxlength="4" placeholder="如：林" autocomplete="off" />
            </div>
            <div class="field">
              <label>性别倾向</label>
              <div class="segmented" id="genderGroup" role="radiogroup" aria-label="性别倾向">
                <button type="button" class="seg is-active" data-gender="不限" aria-pressed="true">不限</button>
                <button type="button" class="seg" data-gender="男孩" aria-pressed="false">男孩</button>
                <button type="button" class="seg" data-gender="女孩" aria-pressed="false">女孩</button>
              </div>
            </div>
          </div>

          <div class="field">
            <label>风格偏好 <span class="hint">可多选</span></label>
            <div class="chips" id="chips">
              <button type="button" class="chip" data-style="文雅">文雅</button>
              <button type="button" class="chip" data-style="大气">大气</button>
              <button type="button" class="chip" data-style="诗意">诗意</button>
              <button type="button" class="chip" data-style="简约">简约</button>
              <button type="button" class="chip" data-style="古典">古典</button>
              <button type="button" class="chip" data-style="现代">现代</button>
              <button type="button" class="chip" data-style="独特">独特</button>
            </div>
          </div>

          <div class="field">
            <label for="requirement">起名需求</label>
            <div class="textarea-wrap">
              <textarea id="requirement" name="requirement" rows="5" maxlength="500" placeholder="例如：希望名字有山水意境，读起来清亮；避开生僻字；寄托平安顺遂的期望……"></textarea>
              <span class="counter"><span id="count">0</span>/500</span>
            </div>
          </div>

          <div class="field">
            <label for="model">使用模型</label>
            <div class="select-wrap">
              <select id="model" name="model">
                <option value="qwen2.5-7b">Qwen2.5 7B · 稳定</option>
                <option value="qwen3-8b">Qwen3 8B · 文采</option>
                <option value="deepseek-v3">DeepSeek V3 · 深度</option>
              </select>
            </div>
          </div>

          <button class="submit" id="submit" type="submit">
            <span class="submit-label" id="submitLabel">开始起名</span>
            <span class="arrow">→</span>
          </button>
          <p class="form-foot">密钥仅保存在服务端环境变量中</p>
        </form>
      </section>

      <section class="card result-card">
        <div class="card-head">
          <span class="num">贰</span>
          <div>
            <h2>静候佳名</h2>
            <p id="statusText">尚未开始</p>
          </div>
          <button class="copy" id="copy" type="button" disabled>复制</button>
        </div>

        <div class="result" id="result" aria-live="polite">
          <div class="empty" id="empty">
            <div class="empty-mark">名</div>
            <p class="empty-quote">「名不正则言不顺，言不顺则事不成。」</p>
            <p class="empty-desc">左侧写下姓氏与期待，<br />三组有出处、有寓意的名字将在这里逐字浮现。</p>
            <div class="empty-meta">流式输出 · 自动存档</div>
          </div>

          <div class="output-wrap" id="outputWrap" hidden>
            <p class="output" id="output"></p>
            <span class="caret" id="caret" hidden></span>
          </div>

          <div class="error-box" id="errorBox" hidden></div>
        </div>

        <div class="result-foot">
          <span class="dot" id="dot"></span>
          <span id="footText">等待输入需求</span>
          <span class="save-note" id="saveNote" hidden></span>
        </div>
      </section>
    </main>

    <footer>
      <div>名字由 AI 生成，仅供参考 · 请结合家族意愿与实际情况选择</div>
      <div>SiliconFlow<span class="sep">·</span>Supabase<span class="sep">·</span>Vercel</div>
    </footer>
  </div>

  <script>
    const els = {
      form: document.getElementById("form"),
      surname: document.getElementById("surname"),
      requirement: document.getElementById("requirement"),
      model: document.getElementById("model"),
      submit: document.getElementById("submit"),
      submitLabel: document.getElementById("submitLabel"),
      count: document.getElementById("count"),
      result: document.getElementById("result"),
      empty: document.getElementById("empty"),
      outputWrap: document.getElementById("outputWrap"),
      output: document.getElementById("output"),
      caret: document.getElementById("caret"),
      errorBox: document.getElementById("errorBox"),
      copy: document.getElementById("copy"),
      statusText: document.getElementById("statusText"),
      footText: document.getElementById("footText"),
      dot: document.getElementById("dot"),
      saveNote: document.getElementById("saveNote"),
      genderGroup: document.getElementById("genderGroup"),
      chips: document.getElementById("chips"),
    };

    let gender = "不限";
    let controller = null;
    let fullText = "";
    let timerId = null;
    let startedAt = 0;

    function setStatus(kind, text) {
      els.dot.classList.remove("is-live", "is-done", "is-error");
      if (kind) els.dot.classList.add(kind);
      els.statusText.textContent = text;
    }

    function setBusy(busy) {
      els.submit.disabled = busy;
      els.submitLabel.textContent = busy ? "推演中…" : "开始起名";
    }

    function elapsedText() {
      const s = (Date.now() - startedAt) / 1000;
      return `${s.toFixed(1)}s`;
    }

    function resetView() {
      fullText = "";
      els.output.textContent = "";
      els.outputWrap.hidden = true;
      els.empty.hidden = false;
      els.errorBox.hidden = true;
      els.errorBox.textContent = "";
      els.copy.disabled = true;
      els.saveNote.hidden = true;
      els.saveNote.textContent = "";
      els.saveNote.title = "";
      els.caret.hidden = true;
    }

    function showError(message) {
      els.errorBox.hidden = false;
      els.errorBox.textContent = message;
      els.empty.hidden = true;
      els.outputWrap.hidden = true;
      els.caret.hidden = true;
      setStatus("is-error", "生成失败");
      els.footText.textContent = "请调整需求后重试";
    }

    function scrollToBottom() {
      els.result.scrollTop = els.result.scrollHeight;
    }

    async function loadModels() {
      try {
        const resp = await fetch("/api/name");
        if (!resp.ok) return;
        const data = await resp.json();
        if (!Array.isArray(data.models) || !data.models.length) return;

        els.model.innerHTML = "";
        data.models.forEach((item) => {
          const opt = document.createElement("option");
          opt.value = item.key;
          opt.textContent = item.label;
          els.model.appendChild(opt);
        });
        if (data.defaultModel) els.model.value = data.defaultModel;
      } catch {
        /* 保留 HTML 中的默认选项 */
      }
    }

    function handleEvent(raw) {
      const lines = raw.split("\n").filter((line) => line.startsWith("data:"));
      if (!lines.length) return;

      let payload;
      try {
        payload = JSON.parse(lines.map((line) => line.slice(5).trim()).join("\n"));
      } catch {
        return;
      }

      if (payload.type === "delta" && payload.text) {
        fullText += payload.text;
        els.empty.hidden = true;
        els.outputWrap.hidden = false;
        els.output.textContent = fullText;
        scrollToBottom();
      }

      if (payload.type === "done") {
        els.caret.hidden = true;
        setStatus("is-done", "已完成");
        els.footText.textContent = `用时 ${elapsedText()}`;
        els.copy.disabled = false;
        if (payload.saved) {
          els.saveNote.hidden = false;
          els.saveNote.textContent = "已存档至 Supabase";
        } else {
          els.saveNote.hidden = false;
          els.saveNote.textContent = "本次未存档";
          els.saveNote.title = payload.reason || "";
        }
        setBusy(false);
      }

      if (payload.type === "error") {
        showError(payload.message || "生成失败，请重试");
        setBusy(false);
      }
    }

    els.requirement.addEventListener("input", () => {
      els.count.textContent = els.requirement.value.length;
      if (els.requirement.value.trim()) els.requirement.classList.remove("is-invalid");
    });

    els.genderGroup.addEventListener("click", (event) => {
      const btn = event.target.closest(".seg");
      if (!btn) return;
      gender = btn.dataset.gender;
      els.genderGroup.querySelectorAll(".seg").forEach((item) => {
        const active = item === btn;
        item.classList.toggle("is-active", active);
        item.setAttribute("aria-pressed", active ? "true" : "false");
      });
    });

    els.chips.addEventListener("click", (event) => {
      const chip = event.target.closest(".chip");
      if (!chip) return;
      const active = chip.classList.toggle("is-active");
      chip.setAttribute("aria-pressed", active ? "true" : "false");
    });

    els.requirement.addEventListener("keydown", (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
        event.preventDefault();
        els.form.requestSubmit();
      }
    });

    els.copy.addEventListener("click", async () => {
      if (!fullText) return;
      try {
        await navigator.clipboard.writeText(fullText);
        els.copy.textContent = "已复制";
        setTimeout(() => (els.copy.textContent = "复制"), 1600);
      } catch {
        els.copy.textContent = "复制失败";
        setTimeout(() => (els.copy.textContent = "复制"), 1600);
      }
    });

    els.form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const requirement = els.requirement.value.trim();
      if (!requirement) {
        els.requirement.classList.add("is-invalid");
        els.requirement.focus();
        els.statusText.textContent = "请先填写起名需求";
        return;
      }

      const styles = Array.from(els.chips.querySelectorAll(".chip.is-active"))
        .map((chip) => chip.dataset.style)
        .join("、");

      resetView();
      setBusy(true);
      setStatus("is-live", "正在推演…");
      startedAt = Date.now();
      timerId = setInterval(() => {
        els.footText.textContent = `正在推演 · ${elapsedText()}`;
      }, 200);
      els.footText.textContent = "正在推演 · 0.0s";

      controller = new AbortController();

      try {
        const resp = await fetch("/api/name", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            requirement,
            surname: els.surname.value.trim(),
            gender,
            style: styles,
            model: els.model.value,
          }),
          signal: controller.signal,
        });

        if (!resp.ok || !resp.body) {
          let message = "请求失败，请稍后重试";
          try {
            const data = await resp.json();
            message = data.error || message;
          } catch {
            /* ignore */
          }
          showError(message);
          setBusy(false);
          return;
        }

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          let idx;
          while ((idx = buffer.indexOf("\n\n")) >= 0) {
            handleEvent(buffer.slice(0, idx));
            buffer = buffer.slice(idx + 2);
          }
        }

        if (buffer.trim()) handleEvent(buffer);
      } catch (error) {
        if (error.name !== "AbortError") {
          showError("网络中断，请重试");
        }
      } finally {
        clearInterval(timerId);
        timerId = null;
        els.caret.hidden = true;
        setBusy(false);
      }
    });

    loadModels();
  </script>
</body>
</html>
